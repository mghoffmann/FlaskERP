<!--
  login.html — the one page in the app with no nav shell (there is no session
  yet, so there is nothing to fetch /api/auth/me for besides "am I already
  logged in?", which login.js handles itself). See requirements/02-auth.md.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopfloor ERP — Login</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="card login-card">
        <h1>Shopfloor ERP</h1>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <p id="login-error" class="field-error" role="alert"></p>
          <button type="submit" class="btn btn-primary" style="width: 100%">Log in</button>
        </form>
      </div>
    </div>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
