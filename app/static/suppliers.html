<!--
  suppliers.html — the supplier directory. Static markup only: js/suppliers.js
  fills the table and wires the toolbar/modals after initShell() confirms a
  session. See requirements/06-purchasing.md "Pages > /suppliers.html".
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopfloor ERP — Suppliers</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header id="nav"></header>
    <main class="page">
      <div class="page-header">
        <h1>Suppliers</h1>
        <!-- data-role="admin": app.js's initShell() removes this for operators
             (UX only — POST /api/suppliers is admin-only on the server too). -->
        <button type="button" id="new-supplier-btn" class="btn btn-primary" data-role="admin">New supplier</button>
      </div>

      <!-- Page-level banner for the 409 conflict Deactivate can return (the
           supplier has a draft/ordered PO) — requirements/06-purchasing.md.
           The confirm flow for Deactivate/Activate happens after the detail
           modal has already closed, so this lives at the page level rather
           than inside the modal (see js/suppliers.js). -->
      <div id="page-banner" class="banner -error" hidden></div>

      <div class="toolbar">
        <input
          id="search-input"
          type="search"
          class="toolbar-input"
          placeholder="Search name…"
          aria-label="Search suppliers"
        />
        <!-- Reciprocal to purchase-orders.html's "Suppliers →" link — 09-frontend.md
             reaches suppliers/customers only via secondary links on the
             purchasing pages' toolbars, not the main nav. -->
        <a href="/purchase-orders.html" class="btn btn-ghost">Purchase orders →</a>
      </div>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Phone</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="suppliers-tbody"></tbody>
      </table>
    </main>
    <script type="module" src="/js/suppliers.js"></script>
  </body>
</html>
