# pytest.ini — pytest configuration for the whole repo.
#
# Why this file exists: the test suite imports the application package
# (`from app import create_app` in tests/conftest.py), and whether that
# import works depends on HOW pytest is launched:
#
#   python -m pytest   -> Python's -m flag puts the current directory (the
#                         repo root) on sys.path, so `app` is importable.
#                         This is what scripts/t.py runs, which is why the
#                         suite always passed locally.
#   pytest             -> the bare console script does NOT add the repo root
#                         to sys.path (pytest only auto-adds the directory
#                         containing each test file / conftest.py — i.e.
#                         tests/, not its parent). This is what CI ran, and
#                         it failed with "No module named 'app'".
#
# `pythonpath = .` (pytest >= 7) tells pytest itself to prepend the repo
# root — "." is resolved relative to THIS file's directory, the rootdir —
# to sys.path before importing anything, making both launch styles behave
# identically everywhere.
[pytest]
pythonpath = .

# Only ever collect tests from tests/ — without this, a bare `pytest` run
# from the repo root would also scan app/, migrations/, scripts/, and
# requirements/ for test-shaped files on every invocation.
testpaths = tests
